name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Russian prompt
        shell: bash
        run: |
          set -e

          PROMPT_FILE="${GITHUB_WORKSPACE}/lang-ru.md"

          echo "Workspace: ${GITHUB_WORKSPACE}"
          echo "Prompt: ${PROMPT_FILE}"

          if [ ! -f "${PROMPT_FILE}" ]; then
            echo "::error::lang-ru.md not found: ${PROMPT_FILE}"
            exit 1
          fi

          echo "Prompt file found:"
          ls -lah "${PROMPT_FILE}"

      - name: Run AI Review
        uses: Nikita-Filonov/ai-review@v0.76.0

        env:
          # ============================================================
          # LLM — OpenRouter
          # ============================================================

          LLM__PROVIDER: "OPENROUTER"

          LLM__META__MODEL: "z-ai/glm-5.3-flash"
          LLM__META__MAX_TOKENS: "15000"
          LLM__META__TEMPERATURE: "0.2"

          LLM__HTTP_CLIENT__VERIFY: "true"
          LLM__HTTP_CLIENT__TIMEOUT: "180"
          LLM__HTTP_CLIENT__API_URL: "https://openrouter.ai/api/v1"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

          # ============================================================
          # GitHub
          # ============================================================

          VCS__PROVIDER: "GITHUB"

          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}

          VCS__HTTP_CLIENT__VERIFY: "true"
          VCS__HTTP_CLIENT__TIMEOUT: "120"
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ============================================================
          # Review
          # ============================================================

          REVIEW__MODE: "FULL_FILE_DIFF"

          REVIEW__DRY_RUN: "false"

          REVIEW__MAX_INLINE_COMMENTS: "10"

          REVIEW__MAX_CONTEXT_COMMENTS: "30"

          REVIEW__INLINE_COMMENT_FALLBACK: "true"

          REVIEW__CONTEXT_LINES: "10"

          # ============================================================
          # Russian language prompt
          # ============================================================

          PROMPT__INLINE_PROMPT_FILES: '["./lang-ru.md"]'

          PROMPT__SUMMARY_PROMPT_FILES: '["./lang-ru.md"]'

          # Keep the built-in system prompts.
          # They define the required response format.
          PROMPT__INCLUDE_INLINE_SYSTEM_PROMPTS: "true"
          PROMPT__INCLUDE_SUMMARY_SYSTEM_PROMPTS: "true"

          # ============================================================
          # Logging
          # ============================================================

          LOGGER__LEVEL: "INFO"

        with:
          review-command: "run"